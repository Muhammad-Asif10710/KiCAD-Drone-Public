name: Request access
description: Ask for access to the private KiCad design files
title: "Access request: "
labels: ["access-request"]
body:
  - type: input
    id: github
    attributes:
      label: GitHub username
      description: The account that should get access
    validations:
      required: true
  - type: dropdown
    id: project
    attributes:
      label: Which project
      options:
        - Coreless (brushed)
        - Brushless
        - Both
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why do you need access?
      description: For example study, building your own, or collaboration
    validations:
      required: true
